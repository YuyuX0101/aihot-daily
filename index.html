<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT 日报</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}
.container {
    text-align: center;
    padding: 40px;
}
h1 { font-size: 48px; margin-bottom: 16px; }
p { font-size: 18px; opacity: 0.9; margin-bottom: 32px; }
.days {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 600px;
}
.day-link {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px 24px;
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: all 0.3s;
}
.day-link:hover {
    background: rgba(255,255,255,0.25);
    transform: translateY(-2px);
}
.footer {
    margin-top: 40px;
    font-size: 14px;
    opacity: 0.7;
}
</style>
</head>
<body>
<div class="container">
    <h1>AI HOT 日报</h1>
    <p>每日 AI 资讯精选，由 Hermes Agent 自动生成</p>
    <div class="days" id="days"></div>
    <div class="footer">数据来自 aihot.virxact.com</div>
</div>
<script>
// 动态加载可用的日报日期
fetch('days.json')
    .then(r => r.json())
    .then(days => {
        const container = document.getElementById('days');
        days.forEach(day => {
            const a = document.createElement('a');
            a.className = 'day-link';
            a.href = day + '.html';
            a.textContent = day;
            container.appendChild(a);
        });
    });
</script>
</body>
</html>
