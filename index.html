<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HOT 日报</title>
<link rel="stylesheet" href="assets/editorial.css">
</head>
<body>
<a class="skip-link" href="#timeline">跳到历史日报</a>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="index.html">AI <span>HOT</span></a>
    <nav class="nav-links" aria-label="主导航">
      <a class="active" aria-current="page" href="index.html">首页</a>
      <a href="e/index.html">统一期次</a>
      <a href="builder/index.html">Builder</a>
      <a href="deals/index.html">羊毛雷达</a>
      <a href="#timeline">历史日报</a>
    </nav>
  </div>
</header>

<section class="hero-home page-wide">
  <div>
    <div class="eyebrow">每日编辑部 · 北京时间</div>
    <h1 class="hero-title">AI HOT</h1>
    <p class="hero-lead">日报、Builder 一手作品与 AI 羊毛雷达集中在网站呈现；飞书只发摘要与链接。完整证据与来源标签以期次页为准。</p>
    <div class="hero-stats" aria-live="polite">
      <div>
        <div class="stat-value" id="total-days">--</div>
        <div class="stat-label">历史期数</div>
      </div>
      <div>
        <div class="stat-value" id="total-items">--</div>
        <div class="stat-label">约计资讯</div>
      </div>
    </div>
  </div>
</section>

<section class="timeline-section" id="timeline">
  <div class="timeline-header">
    <h2>历史日报</h2>
    <span class="timeline-count" id="day-count">加载中…</span>
  </div>
  <div id="timeline-list"></div>
</section>

<footer class="site-footer">
  <p>数据来自 <a href="https://aihot.virxact.com" rel="noopener noreferrer" target="_blank">aihot.virxact.com</a> · 站点托管于 GitHub Pages</p>
  <p>时间显示为 Asia/Shanghai · 历史 <code>YYYY-MM-DD.html</code> URL 保持不变</p>
</footer>

<script>
fetch('days.json?v=' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (days) {
    days.sort(function (a, b) { return b.localeCompare(a); });
    document.getElementById('day-count').textContent = days.length + ' 期';
    document.getElementById('total-days').textContent = String(days.length);
    document.getElementById('total-items').textContent = String(days.length * 28);
    var list = document.getElementById('timeline-list');
    var weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    days.forEach(function (day) {
      var date = new Date(day + 'T00:00:00');
      var formatted = (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + weekdays[date.getDay()];
      var a = document.createElement('a');
      a.className = 'list-card';
      a.href = day + '.html';
      a.innerHTML = '<div class="date">' + formatted + '</div>' +
        '<div>AI HOT 日报 · ' + day + '</div>' +
        '<div class="meta">' + day + ' · 打开历史页</div>';
      list.appendChild(a);
    });
  })
  .catch(function () {
    document.getElementById('timeline-list').innerHTML = '<p class="empty">暂无日报数据</p>';
  });
</script>
</body>
</html>
