<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI HOT 日报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0e1a;
  --bg-surface: #111827;
  --bg-elevated: #1a2236;
  --bg-card: #1e293b;
  --border-subtle: rgba(148, 163, 184, 0.08);
  --border-glow: rgba(56, 189, 248, 0.15);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-cyan: #22d3ee;
  --accent-blue: #3b82f6;
  --accent-purple: #a855f7;
  --accent-gradient: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #a855f7 100%);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ===== HERO ===== */
.hero {
  position: relative;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(34, 211, 238, 0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(168, 85, 247, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse 50% 30% at 20% 60%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
  pointer-events: none;
}

.hero-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 70%);
  pointer-events: none;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 100px;
  background: rgba(34, 211, 238, 0.08);
  border: 1px solid rgba(34, 211, 238, 0.15);
  font-size: 13px;
  font-weight: 500;
  color: var(--accent-cyan);
  letter-spacing: 0.5px;
  margin-bottom: 32px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.8s var(--ease-out) 0.2s forwards;
}

.hero-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-cyan);
  box-shadow: 0 0 8px var(--accent-cyan);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

.hero h1 {
  font-size: clamp(36px, 10vw, 72px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 0.9s var(--ease-out) 0.4s forwards;
}

.hero h1 .gradient {
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-subtitle {
  font-size: clamp(15px, 3vw, 18px);
  color: var(--text-secondary);
  font-weight: 400;
  max-width: 480px;
  margin-bottom: 48px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.8s var(--ease-out) 0.6s forwards;
}

.hero-stats {
  display: flex;
  gap: 40px;
  margin-bottom: 48px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.8s var(--ease-out) 0.8s forwards;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}

.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateX(-50%) translateY(20px);
  animation: fadeUpScroll 0.6s var(--ease-out) 1.2s forwards;
}

.scroll-hint::after {
  content: '';
  width: 1px;
  height: 32px;
  background: linear-gradient(to bottom, var(--accent-cyan), transparent);
  animation: scrollLine 2s ease-in-out infinite;
}

@keyframes scrollLine {
  0%, 100% { transform: scaleY(0); transform-origin: top; }
  50% { transform: scaleY(1); transform-origin: top; }
  51% { transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}

@keyframes fadeUpScroll {
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ===== TIMELINE ===== */
.timeline-section {
  padding: 80px 20px;
  max-width: 720px;
  margin: 0 auto;
}

.timeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
  padding: 0 4px;
}

.timeline-header h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.timeline-count {
  font-size: 13px;
  color: var(--text-muted);
  background: var(--bg-elevated);
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--border-subtle);
}

.timeline {
  position: relative;
  padding-left: 28px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-purple), transparent);
  opacity: 0.3;
}

.timeline-item {
  position: relative;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateX(-20px);
  transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
}

.timeline-item.visible {
  opacity: 1;
  transform: translateX(0);
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -24px;
  top: 20px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--bg-deep);
  border: 2px solid var(--accent-cyan);
  box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.1);
  transition: all 0.3s var(--ease-out);
}

.timeline-item:hover::before {
  background: var(--accent-cyan);
  box-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
}

.day-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 20px 24px;
  cursor: pointer;
  transition: all 0.3s var(--ease-out);
  position: relative;
  overflow: hidden;
}

.day-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.day-card:hover {
  border-color: var(--border-glow);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(34, 211, 238, 0.1);
}

.day-card:hover::before {
  opacity: 1;
}

.day-card:active {
  transform: scale(0.98);
}

.day-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-cyan);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.day-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.day-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-muted);
}

.day-meta .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
}

.day-arrow {
  margin-left: auto;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  transition: all 0.3s var(--ease-out);
}

.day-card:hover .day-arrow {
  color: var(--accent-cyan);
  transform: translateX(4px);
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.empty-state svg {
  width: 64px;
  height: 64px;
  margin-bottom: 24px;
  opacity: 0.5;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 40px 20px;
  border-top: 1px solid var(--border-subtle);
  margin-top: 40px;
}

.footer p {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

.footer a {
  color: var(--accent-cyan);
  text-decoration: none;
  opacity: 0.8;
  transition: opacity 0.2s;
}

.footer a:hover {
  opacity: 1;
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== MOBILE OPTIMIZATIONS ===== */
@media (max-width: 480px) {
  .hero { padding: 32px 20px; }
  .hero-stats { gap: 24px; }
  .stat-value { font-size: 24px; }
  .timeline-section { padding: 60px 16px; }
  .timeline { padding-left: 24px; }
  .day-card { padding: 16px 20px; }
}
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-grid"></div>
  <div class="hero-badge">每日更新</div>
  <h1>AI HOT<br><span class="gradient">日报</span></h1>
  <p class="hero-subtitle">追踪 AI 行业最前沿动态，模型发布、产品更新、论文研究，一网打尽</p>
  <div class="hero-stats">
    <div class="stat">
      <div class="stat-value" id="total-days">--</div>
      <div class="stat-label">期数</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total-items">--</div>
      <div class="stat-label">条资讯</div>
    </div>
  </div>
  <div class="scroll-hint">向下滚动</div>
</section>

<!-- TIMELINE -->
<section class="timeline-section">
  <div class="timeline-header">
    <h2>历史日报</h2>
    <span class="timeline-count" id="day-count">加载中...</span>
  </div>
  <div class="timeline" id="timeline">
    <!-- JS will populate -->
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <p>数据来自 <a href="https://aihot.virxact.com" target="_blank">aihot.virxact.com</a> · 由 Hermes Agent 自动生成</p>
</footer>

<script>
// Fetch available days
fetch('days.json?v=' + Date.now())
  .then(r => r.json())
  .then(days => {
    const timeline = document.getElementById('timeline');
    const dayCount = document.getElementById('day-count');
    const totalDays = document.getElementById('total-days');
    const totalItems = document.getElementById('total-items');

    days.sort((a, b) => b.localeCompare(a)); // newest first

    dayCount.textContent = days.length + ' 期';
    totalDays.textContent = days.length;
    totalItems.textContent = days.length * 28; // approximate

    days.forEach((day, index) => {
      const item = document.createElement('div');
      item.className = 'timeline-item';
      item.style.transitionDelay = (index * 60) + 'ms';

      // Format date: 2026-05-23 -> 5月23日 周五
      const date = new Date(day + 'T00:00:00');
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const formatted = (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + weekdays[date.getDay()];

      item.innerHTML = '<div class="day-card" onclick="location.href=\'' + day + '.html\'">' +
        '<div class="day-date">' + formatted + '</div>' +
        '<div class="day-title">AI HOT 日报 · ' + day + '</div>' +
        '<div class="day-meta">' +
          '<span>' + day + '</span>' +
          '<span class="dot"></span>' +
          '<span>点击查看</span>' +
          '<span class="day-arrow">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>' +
          '</span>' +
        '</div>' +
      '</div>';
      timeline.appendChild(item);
    });

    // Intersection Observer for scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.timeline-item').forEach(item => observer.observe(item));
  })
  .catch(err => {
    document.getElementById('timeline').innerHTML =
      '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>' +
        '<p>暂无日报数据</p>' +
      '</div>';
  });
</script>

</body>
</html>
