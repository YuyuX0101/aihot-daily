<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI HOT 日报 · {{DATE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0a0e1a;
  --bg-surface: #111827;
  --bg-elevated: #1a2236;
  --bg-card: #1e293b;
  --border-subtle: rgba(148, 163, 184, 0.08);
  --border-glow: rgba(56, 189, 248, 0.15);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-cyan: #22d3ee;
  --accent-blue: #3b82f6;
  --accent-purple: #a855f7;
  --accent-green: #34d399;
  --accent-orange: #fb923c;
  --accent-pink: #f472b6;
  --accent-gradient: linear-gradient(135deg, #22d3ee 0%, #3b82f6 50%, #a855f7 100%);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ===== NAV ===== */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
}

.nav-brand {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-back {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 100px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s var(--ease-out);
}

.nav-back:hover {
  border-color: var(--border-glow);
  color: var(--text-primary);
}

.nav-back:active {
  transform: scale(0.97);
}

/* ===== HERO ===== */
.hero {
  position: relative;
  padding: 48px 24px 32px;
  text-align: center;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(34, 211, 238, 0.06) 0%, transparent 60%);
  pointer-events: none;
}

.hero-date {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 100px;
  background: rgba(34, 211, 238, 0.08);
  border: 1px solid rgba(34, 211, 238, 0.12);
  font-size: 13px;
  font-weight: 500;
  color: var(--accent-cyan);
  margin-bottom: 16px;
}

.hero h1 {
  font-size: clamp(28px, 7vw, 48px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 16px;
}

.hero-lead {
  font-size: 15px;
  color: var(--text-secondary);
  max-width: 560px;
  margin: 0 auto 24px;
  line-height: 1.7;
}

.hero-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
}

/* ===== SECTIONS ===== */
.content {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

.section {
  margin-bottom: 40px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
}

.section.visible {
  opacity: 1;
  transform: translateY(0);
}

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}

.section-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.section-icon.models { background: rgba(34, 211, 238, 0.1); }
.section-icon.products { background: rgba(168, 85, 247, 0.1); }
.section-icon.industry { background: rgba(251, 146, 60, 0.1); }
.section-icon.papers { background: rgba(52, 211, 153, 0.1); }
.section-icon.tips { background: rgba(244, 114, 182, 0.1); }

.section-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.section-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-elevated);
  padding: 4px 12px;
  border-radius: 100px;
}

/* ===== ITEMS ===== */
.item {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s var(--ease-out);
}

.item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent-cyan);
  opacity: 0;
  transition: opacity 0.3s;
}

.item:hover {
  border-color: var(--border-glow);
  transform: translateX(4px);
}

.item:hover::before {
  opacity: 1;
}

.item-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}

.item-num {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-cyan);
  flex-shrink: 0;
  margin-top: 2px;
}

.item-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.5;
  flex: 1;
}

.item-source {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 10px;
  padding-left: 38px;
}

.item-source::before {
  content: '';
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
}

.item-summary {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
  padding-left: 38px;
}

.item-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 12px;
  margin-left: 38px;
  font-size: 13px;
  color: var(--accent-cyan);
  text-decoration: none;
  font-weight: 500;
  opacity: 0.8;
  transition: opacity 0.2s;
}

.item-link:hover {
  opacity: 1;
}

/* ===== FLASHES ===== */
.flashes {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 16px 20px;
}

.flash {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 8px 0;
  font-size: 14px;
  color: var(--text-secondary);
}

.flash-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-orange);
  flex-shrink: 0;
  margin-top: 6px;
}

.flash-text {
  flex: 1;
  line-height: 1.6;
}

.flash-source {
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 32px 20px;
  border-top: 1px solid var(--border-subtle);
}

.footer p {
  font-size: 12px;
  color: var(--text-muted);
}

.footer a {
  color: var(--accent-cyan);
  text-decoration: none;
  opacity: 0.7;
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

@media (max-width: 480px) {
  .hero { padding: 36px 20px 24px; }
  .content { padding: 0 16px 40px; }
  .item { padding: 16px; }
  .item-summary, .item-source, .item-link { padding-left: 0; margin-left: 0; }
  .item-header { margin-bottom: 8px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">AI HOT</div>
  <a href="index.html" class="nav-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    返回首页
  </a>
</nav>

<section class="hero">
  <div class="hero-date">{{DATE}}</div>
  <h1>AI HOT 日报</h1>
  <p class="hero-lead">{{LEAD}}</p>
  <div class="hero-stats">
    <div class="stat">
      <div class="stat-value">{{ITEM_COUNT}}</div>
      <div class="stat-label">条精选</div>
    </div>
  </div>
</section>

<main class="content">
  {{SECTIONS}}
  {{FLASHES}}
</main>

<footer class="footer">
  <p>数据来自 <a href="https://aihot.virxact.com" target="_blank">aihot.virxact.com</a> · 由 Hermes Agent 自动生成</p>
</footer>

<script>
// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });

document.querySelectorAll('.section').forEach(s => observer.observe(s));
</script>

</body>
</html>
